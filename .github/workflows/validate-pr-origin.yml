name: Validate PR Origin

on:
  pull_request:
    branches:
      - main

jobs:
  check-origin:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if PR contains commits from develop
        run: |
          git fetch origin develop main

          BASE=$(git merge-base origin/main HEAD)

          echo "Merge base with main: $BASE"

          # Commits que não estão na main
          INVALID_COMMITS=$(git rev-list $BASE..HEAD --not origin/main)

          if [ -n "$INVALID_COMMITS" ]; then
            echo "❌ Este PR contém commits que não pertencem à main."
            echo "Provavelmente houve merge indevido da develop."
            exit 1
          fi

          echo "✅ PR válido"
